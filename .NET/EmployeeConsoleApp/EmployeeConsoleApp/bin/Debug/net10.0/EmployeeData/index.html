<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Portal</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">

  <!-- Header -->
  <div class="glass-card page-header">
    <div class="header-icon">👥</div>
    <div>
      <div class="page-title">Employee Portal</div>
      <div class="page-subtitle">Manage and explore your workforce</div>
    </div>
    <div class="header-stat">
      <div class="stat-number" id="totalCount">—</div>
      <div class="stat-label">Total Employees</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="glass-card controls-bar">
    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" class="glass-input" placeholder="Search by name, email, department…" />
    </div>
    <div class="per-page-wrap">
      Rows:
      <select id="perPage" class="glass-select">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="25">25</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="glass-card" style="margin-bottom:1rem;">
    <div class="table-wrap">
      <table id="empTable">
        <thead>
          <tr>
            <th class="sortable" data-field="name">Name <span class="sort-icon bi bi-chevron-expand"></span></th>
            <th>Gender</th>
            <th class="sortable" data-field="department">Department <span class="sort-icon bi bi-chevron-expand"></span></th>
            <th class="sortable" data-field="email">Email <span class="sort-icon bi bi-chevron-expand"></span></th>
            <th>Phone</th>
            <th style="text-align:center;">Details</th>
          </tr>
        </thead>
        <tbody id="empBody">
          <tr class="state-row"><td colspan="6"><div class="spinner"></div><br/>Loading employees…</td></tr>
        </tbody>
      </table>
    </div>
  </div>


  <div class="glass-card pagination-bar">
    <div class="page-info" id="pageInfo">—</div>
    <div class="page-btns" id="pageBtns"></div>
  </div>

</div>

<div class="modal fade" id="empModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title"><i class="bi bi-person-badge me-2"></i>Employee Details</span>
        <button class="btn-close-custom" data-bs-dismiss="modal"><i class="bi bi-x"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>


<div class="toast-wrap" id="toastWrap" style="display:none;">
  <div class="glass-toast" id="toastMsg"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="employeeTable.js"></script>
<script src="app.js"></script>
</body>
</html>
